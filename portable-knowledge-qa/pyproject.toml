[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-knowledge-qa"
version = "0.4.0"
description = "TRAE skill for local knowledge retrieval and grounded QA"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
]

[project.scripts]
knowledge-qa = "portable_knowledge_qa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portable_knowledge_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
